name: barrel_gen
description: Build-runner barrel generation for Dart and Flutter packages and monorepos.
version: 0.1.0
homepage: https://github.com/Foxpace/barrel_gen
repository: https://github.com/Foxpace/barrel_gen
issue_tracker: https://github.com/Foxpace/barrel_gen/issues

topics:
  - barrel-file
  - build-runner
  - code-generation
  - monorepo

environment:
  sdk: ^3.12.2

dependencies:
  args: ^2.7.0
  build: '>=3.0.0 <5.0.0'
  glob: ^2.1.3
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  build_runner: 2.7.1
  lints: ^6.1.0
  test: 1.31.1
